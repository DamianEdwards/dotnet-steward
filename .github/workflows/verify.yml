name: Verify PowerShell

on:
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psd1'
      - '**/*.psm1'
      - '**/*.ps1xml'
  push:
    branches:
      - main
    paths:
      - '**/*.ps1'
      - '**/*.psd1'
      - '**/*.psm1'
      - '**/*.ps1xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run module verification
        shell: pwsh
        run: .\tests\Verify.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run module verification
        shell: powershell
        run: .\tests\Verify.ps1
