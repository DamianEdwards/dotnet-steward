name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Run module verification
        shell: pwsh
        run: .\tests\Verify.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Run module verification
        shell: powershell
        run: .\tests\Verify.ps1
