name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install release packaging tools
        shell: pwsh
        run: |
          $available = Get-Module -ListAvailable Microsoft.PowerShell.PSResourceGet |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if ($null -eq $available -or $available.Version -lt [version] '1.1.0') {
              Install-Module Microsoft.PowerShell.PSResourceGet `
                  -MinimumVersion 1.1.0 `
                  -Repository PSGallery `
                  -Scope CurrentUser `
                  -Force `
                  -AllowClobber
          }

      - name: Run module verification
        shell: pwsh
        env:
          DOTNET_STEWARD_REQUIRE_PACKAGING_TESTS: true
        run: .\tests\Verify.ps1

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run module verification
        shell: powershell
        run: .\tests\Verify.ps1
